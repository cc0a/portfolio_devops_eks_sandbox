
name: Portfolio EKS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install automation dependencies
        run: pip install -r automation/requirements.txt

      - name: Validate Python source
        run: python -m compileall -q app automation

      - name: Build application image
        run: docker build -t cloud-incident-manager:ci .

      - name: Build automation runner image
        run: docker build -t cloud-incident-manager-runner:ci ./automation

  publish:
    name: Publish Images to ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push application image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/cloud-incident-manager:$IMAGE_TAG" .
          docker push "$REGISTRY/cloud-incident-manager:$IMAGE_TAG"

      - name: Build and push automation runner image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/cloud-incident-manager-runner:$IMAGE_TAG" ./automation
          docker push "$REGISTRY/cloud-incident-manager-runner:$IMAGE_TAG"
