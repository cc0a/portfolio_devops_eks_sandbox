
name: Cloud Incident Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Python and Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install automation dependencies
        run: |
          pip install -r automation/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q app automation

      - name: Build application image
        run: |
          docker build -t cloud-incident-manager:ci .

      - name: Build automation image
        run: |
          docker build -t cloud-incident-manager-runner:ci ./automation
